# Sprint-3 load test: full-size synthetic Snapshot through the real pipeline
# against a local Postgres. Manual trigger; count is configurable.
name: loadtest
on:
  workflow_dispatch:
    inputs:
      products:
        description: "Number of products in the synthetic Snapshot"
        default: "1000000"

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared -w worker
      - name: Generate synthetic Snapshot
        run: node worker/dist/genfeed.js "${{ inputs.products }}" /tmp/feed.xml
      - name: Run the pipeline end to end
        run: node worker/dist/loadtest.js /tmp/feed.xml
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
