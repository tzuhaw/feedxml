name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Library packages must be built (in dependency order) before anything
      # that imports them typechecks: their entry points are dist/*.d.ts, which
      # do not exist in a fresh checkout. shared -> domain -> worker.
      #
      # worker is in this chain because apps/web imports @feedxml/worker/run for
      # the operator upload path. Leaving it out cost four red CI runs: it
      # typechecks fine on any machine that has built the worker at some point,
      # and fails only on a clean checkout, which is exactly what CI is.
      - run: npm run build -w packages/shared
      - run: npm run build -w packages/domain
      - run: npm run build -w worker
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build -w apps/web
        env:
          DATABASE_URL: postgres://ci-placeholder
