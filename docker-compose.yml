# Local development and test dependencies. Nothing here is production:
# production is Supabase (database), R2 (snapshots), Vercel (app) and a
# Cloud Run Job (worker).
#
#   npm run dev:setup           # Postgres on 55432 + schema, one command
#   npm run demo -w worker      # a fixture snapshot through the whole pipeline
#
# Object storage is OPTIONAL and off by default — the demo, the tests and the
# admin panel never touch it, and it only matters when exercising the real
# push/pull/scrape channels:
#
#   docker compose --profile storage up -d
#
# Port 55432 rather than 5432 so this never collides with a Postgres you
# already have running.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - feedxml-pgdata:/var/lib/postgresql/data

  # S3-compatible stand-in for Cloudflare R2, so the push/pull/scrape channels
  # can be exercised locally. Console at http://localhost:9001 (minioadmin).
  storage:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - feedxml-storage:/data

  # Creates the bucket once storage is up, then exits.
  storage-init:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/feedxml &&
      echo 'bucket ready'
      "

volumes:
  feedxml-pgdata:
  feedxml-storage:
